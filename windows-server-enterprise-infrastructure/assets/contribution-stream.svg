<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">Fred Castillo contribution stream</title>
  <desc id="desc">An animated terminal workflow moving from learning through building, testing, hardening, documenting, and publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#06130f"/>
    </linearGradient>
    <linearGradient id="pathColor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4feecf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .step { fill: #f0f6fc; font-size: 17px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 11px; letter-spacing: .6px; }
      .node { animation: node 4.8s ease-out 1 both; }
      .stream { stroke-dasharray: 1212; stroke-dashoffset: 1212; animation: draw 4.8s ease-out 1 forwards; }
      @keyframes node { 0%, 18% { opacity: .35; } 45%, 100% { opacity: 1; } }
      @keyframes draw { from { stroke-dashoffset: 1212; } to { stroke-dashoffset: 0; } }
      @media (max-width: 500px) {
        .step { font-size: 23px; }
        .sub { font-size: 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node { animation: none; opacity: 1; }
        .stream { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="758" height="308" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="46" rx="14" fill="#161b22"/>
  <path d="M1 33V47H759V33" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f"/>
  <text x="88" y="30" fill="#8b949e" font-size="13">fred@security-lab:~/activity$</text>
  <text x="318" y="30" fill="#4feecf" font-size="13" font-weight="700">git log --stream</text>

  <path d="M105 108H655V220H105" fill="none" stroke="#21262d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="stream" d="M105 108H655V220H105" fill="none" stroke="url(#pathColor)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="node" transform="translate(105 108)">
    <circle r="20" fill="#0d1117" stroke="#22d3ee" stroke-width="3"/><circle r="6" fill="#22d3ee"/>
    <text class="step" x="0" y="45" text-anchor="middle">LEARN</text><text class="sub" x="0" y="63" text-anchor="middle">FOUNDATION</text>
  </g>
  <g class="node" transform="translate(380 108)" style="animation-delay:.35s">
    <circle r="20" fill="#0d1117" stroke="#4feecf" stroke-width="3"/><path d="M-8 1L-2 7L10-9" fill="none" stroke="#4feecf" stroke-width="3" stroke-linecap="round"/>
    <text class="step" x="0" y="45" text-anchor="middle">BUILD</text><text class="sub" x="0" y="63" text-anchor="middle">LAB</text>
  </g>
  <g class="node" transform="translate(655 108)" style="animation-delay:.7s">
    <circle r="20" fill="#0d1117" stroke="#4feecf" stroke-width="3"/><path d="M-8 0H8M0-8V8" stroke="#4feecf" stroke-width="3" stroke-linecap="round"/>
    <text class="step" x="0" y="45" text-anchor="middle">TEST</text><text class="sub" x="0" y="63" text-anchor="middle">VALIDATE</text>
  </g>
  <g class="node" transform="translate(655 220)" style="animation-delay:1.05s">
    <circle r="20" fill="#0d1117" stroke="#f97316" stroke-width="3"/><path d="M0-10L10-4V5L0 11L-10 5V-4Z" fill="none" stroke="#f97316" stroke-width="2"/>
    <text class="step" x="0" y="45" text-anchor="middle">HARDEN</text><text class="sub" x="0" y="63" text-anchor="middle">REDUCE RISK</text>
  </g>
  <g class="node" transform="translate(380 220)" style="animation-delay:1.4s">
    <circle r="20" fill="#0d1117" stroke="#8b5cf6" stroke-width="3"/><path d="M-7-9H7V9H-7ZM-3-4H4M-3 1H4M-3 6H2" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text class="step" x="0" y="45" text-anchor="middle">DOCUMENT</text><text class="sub" x="0" y="63" text-anchor="middle">EVIDENCE</text>
  </g>
  <g class="node" transform="translate(105 220)" style="animation-delay:1.75s">
    <circle r="20" fill="#0d1117" stroke="#4feecf" stroke-width="3"/><path d="M-8 1L-2 7L10-9" fill="none" stroke="#4feecf" stroke-width="3" stroke-linecap="round"/>
    <text class="step" x="0" y="45" text-anchor="middle">PUBLISH</text><text class="sub" x="0" y="63" text-anchor="middle">SHARE</text>
  </g>

  <text x="28" y="294" fill="#6e7681" font-size="10">CONTROLLED LABS / REPRODUCIBLE WORK / CLEAR EVIDENCE</text>
  <text x="732" y="294" fill="#4feecf" font-size="10" text-anchor="end">STREAM COMPLETE</text>
</svg>
