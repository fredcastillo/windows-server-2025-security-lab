<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1075" viewBox="0 0 760 1075" role="img" aria-labelledby="title desc">
  <title id="title">Fred Castillo technical stack</title>
  <desc id="desc">A visual technical stack grouped into security, infrastructure, networking, automation, and cloud technologies. Every item has a local vector icon.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#06130f"/>
    </linearGradient>
    <linearGradient id="scanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4feecf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4feecf" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <symbol id="shield" viewBox="0 0 32 32">
      <path d="M16 3L27 7V15C27 22 22 27 16 30C10 27 5 22 5 15V7Z"/>
      <path d="M10 16L14 20L22 11"/>
    </symbol>
    <symbol id="radar" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="7"/><circle cx="16" cy="16" r="2"/>
      <path d="M16 16L25 8M16 4V7M28 16H25"/>
    </symbol>
    <symbol id="packets" viewBox="0 0 32 32">
      <path d="M3 22H8L11 10L15 26L19 6L23 22H29"/>
      <path d="M5 5H11M21 28H27"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 32 32">
      <rect x="6" y="13" width="20" height="15" rx="3"/>
      <path d="M10 13V9A6 6 0 0122 9V13M16 19V23"/>
    </symbol>
    <symbol id="key" viewBox="0 0 32 32">
      <circle cx="10" cy="12" r="6"/><path d="M14 16L27 29M21 23L25 19M24 26L28 22"/>
    </symbol>
    <symbol id="windows" viewBox="0 0 32 32">
      <path d="M3 5L14 3V15H3ZM18 3L29 1V15H18ZM3 18H14V29L3 27ZM18 18H29V31L18 29Z"/>
    </symbol>
    <symbol id="directory" viewBox="0 0 32 32">
      <circle cx="16" cy="6" r="3"/><circle cx="7" cy="25" r="3"/><circle cx="16" cy="25" r="3"/><circle cx="25" cy="25" r="3"/>
      <path d="M16 9V15M7 15H25M7 15V22M16 15V22M25 15V22"/>
    </symbol>
    <symbol id="terminal" viewBox="0 0 32 32">
      <rect x="3" y="5" width="26" height="22" rx="3"/><path d="M8 12L13 16L8 20M16 21H23"/>
    </symbol>
    <symbol id="containers" viewBox="0 0 32 32">
      <rect x="3" y="15" width="7" height="6"/><rect x="12" y="15" width="7" height="6"/><rect x="21" y="15" width="7" height="6"/>
      <rect x="12" y="7" width="7" height="6"/><rect x="21" y="7" width="7" height="6"/>
      <path d="M3 23C7 29 22 30 29 21"/>
    </symbol>
    <symbol id="cluster" viewBox="0 0 32 32">
      <rect x="3" y="4" width="10" height="9" rx="2"/><rect x="19" y="4" width="10" height="9" rx="2"/><rect x="11" y="20" width="10" height="9" rx="2"/>
      <path d="M8 13V17H24V13M16 17V20"/>
    </symbol>
    <symbol id="interlock" viewBox="0 0 32 32">
      <rect x="3" y="8" width="15" height="15" rx="2"/><rect x="14" y="8" width="15" height="15" rx="2"/>
      <path d="M10 15H22M16 9V22"/>
    </symbol>
    <symbol id="router" viewBox="0 0 32 32">
      <rect x="3" y="10" width="26" height="14" rx="3"/><circle cx="9" cy="17" r="2"/><circle cx="15" cy="17" r="2"/>
      <path d="M20 17H26M23 14L26 17L23 20"/>
    </symbol>
    <symbol id="route" viewBox="0 0 32 32">
      <circle cx="6" cy="7" r="3"/><circle cx="26" cy="7" r="3"/><circle cx="16" cy="26" r="3"/>
      <path d="M9 7H23M8 9L14 23M24 9L18 23"/>
    </symbol>
    <symbol id="vlan" viewBox="0 0 32 32">
      <rect x="3" y="4" width="11" height="10" rx="2"/><rect x="18" y="4" width="11" height="10" rx="2"/><rect x="3" y="18" width="11" height="10" rx="2"/><rect x="18" y="18" width="11" height="10" rx="2"/>
      <path d="M14 9H18M14 23H18"/>
    </symbol>
    <symbol id="acl" viewBox="0 0 32 32">
      <rect x="5" y="3" width="22" height="26" rx="3"/><path d="M10 10L12 12L15 8M18 10H23M10 18L12 20L15 16M18 18H23"/>
    </symbol>
    <symbol id="tunnel" viewBox="0 0 32 32">
      <path d="M3 25V15A13 13 0 0129 15V25H22V15A6 6 0 0010 15V25Z"/>
      <rect x="13" y="18" width="6" height="8" rx="1"/>
    </symbol>
    <symbol id="shell" viewBox="0 0 32 32">
      <rect x="3" y="5" width="26" height="22" rx="3"/><path d="M8 11L14 16L8 21M17 21H24"/>
    </symbol>
    <symbol id="python" viewBox="0 0 32 32">
      <path d="M16 3C10 3 8 6 8 10V14H17V17H7C3 17 3 23 5 26C7 29 10 29 13 29V24C13 21 15 19 18 19H24C27 19 29 17 29 14V9C29 5 25 3 21 3Z"/>
      <circle cx="21" cy="8" r="1.5" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ansible" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13"/><path d="M10 24L16 8L23 24L16 19Z"/>
    </symbol>
    <symbol id="blocks" viewBox="0 0 32 32">
      <path d="M4 5L11 2L18 6L11 10ZM14 12L21 9L28 13L21 17ZM4 18L11 15L18 19L11 23ZM14 25L21 22L28 26L21 30Z"/>
    </symbol>
    <symbol id="azure" viewBox="0 0 32 32">
      <path d="M13 3L4 23H13L16 16L21 27H29L18 3ZM10 23H23"/>
    </symbol>
    <symbol id="oracle" viewBox="0 0 32 32">
      <path d="M11 8H21A8 8 0 0121 24H11A8 8 0 0111 8Z"/><path d="M11 13H21A3 3 0 0121 19H11A3 3 0 0111 13Z"/>
    </symbol>

    <style>
      text { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .panel { fill: #0b1517; stroke: #21262d; stroke-width: 2; }
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .card-label { fill: #f0f6fc; font-size: 18px; font-weight: 700; }
      .category { font-size: 18px; font-weight: 800; letter-spacing: 1.2px; }
      .meta { fill: #8b949e; font-size: 11px; letter-spacing: .6px; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .solid-icon { fill: currentColor; stroke: none; }
      .security { color: #4feecf; }
      .systems { color: #22d3ee; }
      .network { color: #8b5cf6; }
      .cloud { color: #f97316; }
      .category.security { fill: #4feecf; }
      .category.systems { fill: #22d3ee; }
      .category.network { fill: #8b5cf6; }
      .category.cloud { fill: #f97316; }
      .scanner { animation: scan 4.6s ease-out 1 both; }
      .status-dot { animation: pulse 1.15s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
      @keyframes scan { from { transform: translateX(-760px); opacity: 0; } 12% { opacity: .8; } to { transform: translateX(760px); opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.12); } }
      @media (max-width: 500px) {
        .card-label { font-size: 24px; }
        .category { font-size: 23px; }
        .meta { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { .scanner, .status-dot { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="758" height="1073" rx="14" fill="url(#background)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="47" rx="14" fill="#161b22"/>
  <path d="M1 33V48H759V33" fill="#161b22"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f"/>
  <text x="88" y="30" fill="#8b949e" font-size="13">fred@security-lab:~/stack$</text>
  <text x="305" y="30" fill="#4feecf" font-size="13" font-weight="700">./inventory --visual</text>
  <circle class="status-dot" cx="715" cy="24" r="5" fill="#4feecf" filter="url(#softGlow)"/>
  <text x="702" y="29" fill="#4feecf" font-size="11" text-anchor="end">LOCAL</text>

  <rect class="panel" x="16" y="62" width="728" height="232" rx="12"/>
  <rect x="16" y="62" width="5" height="232" rx="2" fill="#4feecf"/>
  <text class="category security" x="32" y="91">SECURITY &amp; DETECTION</text>
  <text class="meta" x="728" y="90" text-anchor="end">MONITOR / ASSESS / CONTROL</text>

  <g transform="translate(30 105)"><rect class="card" width="338" height="50" rx="9"/><g class="icon security" transform="translate(12 9)" width="32" height="32"><use href="#shield" width="32" height="32"/></g><text class="card-label" x="56" y="32">Wazuh SIEM</text></g>
  <g transform="translate(392 105)"><rect class="card" width="338" height="50" rx="9"/><g class="icon security" transform="translate(12 9)"><use href="#radar" width="32" height="32"/></g><text class="card-label" x="56" y="32">Nessus Scanner</text></g>
  <g transform="translate(30 165)"><rect class="card" width="338" height="50" rx="9"/><g class="icon security" transform="translate(12 9)"><use href="#packets" width="32" height="32"/></g><text class="card-label" x="56" y="32">Wireshark</text></g>
  <g transform="translate(392 165)"><rect class="card" width="338" height="50" rx="9"/><g class="icon security" transform="translate(12 9)"><use href="#lock" width="32" height="32"/></g><text class="card-label" x="56" y="32">System Hardening</text></g>
  <g transform="translate(211 225)"><rect class="card" width="338" height="50" rx="9"/><g class="icon security" transform="translate(12 9)"><use href="#key" width="32" height="32"/></g><text class="card-label" x="56" y="32">Identity &amp; Access</text></g>

  <rect class="panel" x="16" y="308" width="728" height="232" rx="12"/>
  <rect x="16" y="308" width="5" height="232" rx="2" fill="#22d3ee"/>
  <text class="category systems" x="32" y="337">SYSTEMS &amp; INFRASTRUCTURE</text>
  <text class="meta" x="728" y="336" text-anchor="end">DEPLOY / OPERATE / VIRTUALIZE</text>

  <g transform="translate(30 351)"><rect class="card" width="338" height="50" rx="9"/><g class="icon systems" transform="translate(12 9)"><use href="#windows" width="32" height="32"/></g><text class="card-label" x="56" y="32">Windows Server</text></g>
  <g transform="translate(392 351)"><rect class="card" width="338" height="50" rx="9"/><g class="icon systems" transform="translate(12 9)"><use href="#directory" width="32" height="32"/></g><text class="card-label" x="56" y="32">Active Directory</text></g>
  <g transform="translate(30 411)"><rect class="card" width="338" height="50" rx="9"/><g class="icon systems" transform="translate(12 9)"><use href="#terminal" width="32" height="32"/></g><text class="card-label" x="56" y="32">Linux</text></g>
  <g transform="translate(392 411)"><rect class="card" width="338" height="50" rx="9"/><g class="icon systems" transform="translate(12 9)"><use href="#containers" width="32" height="32"/></g><text class="card-label" x="56" y="32">Docker</text></g>
  <g transform="translate(30 471)"><rect class="card" width="338" height="50" rx="9"/><g class="icon systems" transform="translate(12 9)"><use href="#cluster" width="32" height="32"/></g><text class="card-label" x="56" y="32">Proxmox VE</text></g>
  <g transform="translate(392 471)"><rect class="card" width="338" height="50" rx="9"/><g class="icon systems" transform="translate(12 9)"><use href="#interlock" width="32" height="32"/></g><text class="card-label" x="56" y="32">VMware</text></g>

  <rect class="panel" x="16" y="554" width="728" height="232" rx="12"/>
  <rect x="16" y="554" width="5" height="232" rx="2" fill="#8b5cf6"/>
  <text class="category network" x="32" y="583">NETWORKING</text>
  <text class="meta" x="728" y="582" text-anchor="end">ROUTE / SEGMENT / PROTECT</text>

  <g transform="translate(30 597)"><rect class="card" width="338" height="50" rx="9"/><g class="icon network" transform="translate(12 9)"><use href="#router" width="32" height="32"/></g><text class="card-label" x="56" y="32">Cisco Networking</text></g>
  <g transform="translate(392 597)"><rect class="card" width="338" height="50" rx="9"/><g class="icon network" transform="translate(12 9)"><use href="#route" width="32" height="32"/></g><text class="card-label" x="56" y="32">OSPF Routing</text></g>
  <g transform="translate(30 657)"><rect class="card" width="338" height="50" rx="9"/><g class="icon network" transform="translate(12 9)"><use href="#vlan" width="32" height="32"/></g><text class="card-label" x="56" y="32">VLAN Switching</text></g>
  <g transform="translate(392 657)"><rect class="card" width="338" height="50" rx="9"/><g class="icon network" transform="translate(12 9)"><use href="#acl" width="32" height="32"/></g><text class="card-label" x="56" y="32">Network ACLs</text></g>
  <g transform="translate(211 717)"><rect class="card" width="338" height="50" rx="9"/><g class="icon network" transform="translate(12 9)"><use href="#tunnel" width="32" height="32"/></g><text class="card-label" x="56" y="32">IPsec VPN</text></g>

  <rect class="panel" x="16" y="800" width="728" height="232" rx="12"/>
  <rect x="16" y="800" width="5" height="232" rx="2" fill="#f97316"/>
  <text class="category cloud" x="32" y="829">AUTOMATION &amp; CLOUD</text>
  <text class="meta" x="728" y="828" text-anchor="end">SCRIPT / PROVISION / SCALE</text>

  <g transform="translate(30 843)"><rect class="card" width="338" height="50" rx="9"/><g class="icon cloud" transform="translate(12 9)"><use href="#shell" width="32" height="32"/></g><text class="card-label" x="56" y="32">PowerShell</text></g>
  <g transform="translate(392 843)"><rect class="card" width="338" height="50" rx="9"/><g class="icon cloud" transform="translate(12 9)"><use href="#python" width="32" height="32"/></g><text class="card-label" x="56" y="32">Python</text></g>
  <g transform="translate(30 903)"><rect class="card" width="338" height="50" rx="9"/><g class="icon cloud" transform="translate(12 9)"><use href="#ansible" width="32" height="32"/></g><text class="card-label" x="56" y="32">Ansible</text></g>
  <g transform="translate(392 903)"><rect class="card" width="338" height="50" rx="9"/><g class="icon cloud" transform="translate(12 9)"><use href="#blocks" width="32" height="32"/></g><text class="card-label" x="56" y="32">Terraform</text></g>
  <g transform="translate(30 963)"><rect class="card" width="338" height="50" rx="9"/><g class="icon cloud" transform="translate(12 9)"><use href="#azure" width="32" height="32"/></g><text class="card-label" x="56" y="32">Microsoft Azure</text></g>
  <g transform="translate(392 963)"><rect class="card" width="338" height="50" rx="9"/><g class="icon cloud" transform="translate(12 9)"><use href="#oracle" width="32" height="32"/></g><text class="card-label" x="56" y="32">Oracle Cloud</text></g>

  <rect class="scanner" x="720" y="55" width="40" height="980" fill="url(#scanner)" filter="url(#softGlow)" opacity="0"/>
  <text x="28" y="1058" fill="#6e7681" font-size="11">22 CAPABILITIES / 4 OPERATING DOMAINS</text>
  <text x="732" y="1058" fill="#4feecf" font-size="11" text-anchor="end">INVENTORY READY</text>
</svg>
